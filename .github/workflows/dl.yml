name: descarga-quran-temporal
on:
  push:
    branches: [tmp-descarga-quran]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          mkdir -p out parts
          B=https://everyayah.com/data/Yasser_Ad-Dussary_128kbps
          while read n s a b; do
            rm -f list.txt
            for ((i=a;i<=b;i++)); do
              f=$(printf "%03d%03d.mp3" $s $i)
              [ -f parts/$f ] || curl -sfL --retry 3 -o parts/$f $B/$f
              echo "file 'parts/$f'" >> list.txt
            done
            ffmpeg -v error -f concat -safe 0 -i list.txt -c copy "out/$n.mp3"
            echo "$n $(ffprobe -v error -show_entries format=duration -of csv=p=0 out/$n.mp3)"
          done < .tmp/segs.txt
      - run: |
          mkdir -p tmpout && cp out/*.mp3 tmpout/
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmpout && git commit -q -m "tmp audios" && git push -f origin HEAD:tmp-descarga-quran-out
